spring.application.name=campusflow

# DB (값은 .env에서 로드)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# AI - Claude (primary)
ai.claude.api-key=${CLAUDE_API_KEY}
ai.claude.model=${CLAUDE_MODEL:claude-opus-4-7}

# AI - OpenAI (backup)
ai.openai.api-key=${OPENAI_API_KEY}
ai.openai.model=${OPENAI_MODEL:gpt-4o}

# 컴정이(komjeong) RAG — 학과 자료 기반 내부 로드맵 (10.8.0.17:8000, OpenAI 호환)
komjeong.base-url=${KOMJEONG_BASE_URL:http://10.8.0.17:8000}

# 파일 업로드 (수업 자료 대응 — 대용량 PDF/영상 허용)
spring.servlet.multipart.max-file-size=${MULTIPART_MAX_FILE_SIZE:100MB}
spring.servlet.multipart.max-request-size=${MULTIPART_MAX_REQUEST_SIZE:100MB}

# 파일 저장 (NovaClass 포팅 — 로컬 디스크 저장 + 단기 HMAC 티켓 스트리밍)
campusflow.storage.root=${STORAGE_ROOT:./storage}
campusflow.storage.ticket-secret=${STORAGE_TICKET_SECRET:${JWT_SECRET}}
campusflow.storage.ticket-ttl-seconds=${STORAGE_TICKET_TTL:120}

# AI - LiteLLM 게이트웨이 (10.8.0.1:4000). 모든 AI 호출의 단일 경로. role=smart-share.
# smart-share = 비민감 공유 트래픽 최대가용 역할(로컬/SAFE→데이터공유무료→유료 최후 폴백 사다리).
# 노션 「AI 네이티브 인프라」 규칙: 벤더 직접호출 금지, 역할명만 요청, 라우팅·폴백은 게이트웨이 중앙 통제.
litellm.base-url=${LITELLM_BASE_URL:}
litellm.api-key=${LITELLM_API_KEY:}
litellm.text-model=${LITELLM_TEXT_MODEL:smart-share}
litellm.audio-model=${LITELLM_AUDIO_MODEL:whisper-large-v3}
# 음성(whisper)은 게이트웨이 미등록 시 비활성 유지(base-url 활성화와 분리). 등록 후 true.
litellm.audio-enabled=${LITELLM_AUDIO_ENABLED:false}

# 시맨틱 답변 캐시 (일반 Q&A: komjeong 챗·kmate 튜터). 유사 질문이면 AI 없이 ChromaDB 저장답변 즉답.
# 프롬프트에 최신성 키워드 있으면 캐시 우회 후 AI. best-effort — 임베딩/Chroma 실패는 무시하고 AI 통과.
semantic-cache.enabled=${SEMANTIC_CACHE_ENABLED:true}
semantic-cache.similarity-threshold=${SEMANTIC_CACHE_THRESHOLD:0.93}
semantic-cache.ttl-days=${SEMANTIC_CACHE_TTL_DAYS:30}
semantic-cache.embed-model=${SEMANTIC_CACHE_EMBED_MODEL:embed}
semantic-cache.embed-timeout-ms=${SEMANTIC_CACHE_EMBED_TIMEOUT_MS:4000}
# 최신성 키워드는 한글이라 application.properties(ISO-8859-1로 읽힘)에 두면 깨진다.
# → SemanticCacheService의 @Value 기본값(UTF-8 컴파일된 Java 리터럴) 사용. 오버라이드는 env SEMANTIC_CACHE_FRESHNESS_KEYWORDS로.
# ChromaDB v2 (신규 캐시 컬렉션 전용 — komjeong RAG와 분리). 구 CHROMA_HOST/PORT(폐기 v1)와 무관.
chroma.base-url=${CHROMA_BASE_URL:http://10.8.0.17:8001}
chroma.collection=${CHROMA_COLLECTION:campusflow_qa_cache}

# 클래스 화상 미팅 (Jitsi 방 URL 생성용 베이스)
campusflow.meeting.jitsi-base=${JITSI_BASE:https://meet.jit.si}

# 이메일 (내부 메일 서버 10.8.0.17, SPF+DKIM+DMARC 설정 완료)
spring.mail.host=${MAIL_HOST:10.8.0.17}
spring.mail.port=${MAIL_PORT:25}
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false
mail.from=${MAIL_FROM:campusflow@decodns.org}

# ── AI 폴백 체인 ─────────────────────────────────────────────
# 1순위: jvision.ai (전주비전대 자체 vLLM)
jvision.ai.token=${JVISION_AI_TOKEN:}

# 2순위: Ollama 로컬 서버 (내부망, round-robin)
ollama.servers=${OLLAMA_SERVERS:http://10.8.0.30:11434,http://10.8.0.31:11434,http://10.8.0.32:11434,http://10.8.0.33:11434,http://10.8.0.34:11434}

# 3순위: Google Gemini (최후 폴백)
gemini.api.key=${GEMINI_API_KEY:}

# 외부 API (취업 정보 - data.go.kr)
worknet.api.key=${WORKNET_API_KEY:}
qnet.api.key=${QNET_API_KEY:}
blind.recruit.api.key=${BLIND_RECRUIT_API_KEY:}
saramin.api.key=${SARAMIN_API_KEY:}

# 학교 포털 연동 서버 (10.8.0.14 FastAPI)
intranet.sync.url=${INTRANET_SYNC_URL:http://10.8.0.14:8000}

# 신규 채용공고 Discord 알림 (웹훅 URL은 비밀값 — .env 전용, 코드/설정에 하드코딩 금지)
discord.webhook-url=${DISCORD_WEBHOOK_URL:}
discord.alert-keywords=${DISCORD_ALERT_KEYWORDS:AI,인공지능,머신러닝,ML,딥러닝,LLM,데이터,파이썬,백엔드,개발}

# Web Push (VAPID — 브라우저 푸시 알림). 키 미설정 시 푸시 비활성(앱 기동에 영향 없음)
vapid.public-key=${VAPID_PUBLIC_KEY:}
vapid.private-key=${VAPID_PRIVATE_KEY:}
vapid.subject=${VAPID_SUBJECT:mailto:noreply@campusflow.jvision.org}

# 서버
server.port=8080

# ── HikariCP 연결 풀 최적화 ──────────────────────────────────
spring.datasource.hikari.pool-name=CampusFlowPool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000

# ── GZIP 응답 압축 ────────────────────────────────────────────
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain,application/javascript,text/css
server.compression.min-response-size=1024

# ── Tomcat 스레드 ─────────────────────────────────────────────
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=20
server.tomcat.accept-count=100
server.tomcat.max-connections=8192

# ── JPA 최적화 ────────────────────────────────────────────────
spring.jpa.open-in-view=false

# ── Jackson — null 필드 직렬화 제외 (응답 페이로드 감소) ──────
spring.jackson.default-property-inclusion=non_null
# LocalDate/LocalDateTime → "2026-05-27" 문자열 (배열 직렬화 방지)
spring.jackson.serialization.write-dates-as-timestamps=false

# ── 로그 레벨 최적화 (운영 시 불필요한 SQL 로그 제거) ─────────
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.orm.jdbc.bind=WARN
