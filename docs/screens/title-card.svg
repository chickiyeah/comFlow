<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" font-family="'Malgun Gothic','Noto Sans KR',sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#00236f"/>
      <stop offset="1" stop-color="#001233"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.18" r="0.5">
      <stop offset="0" stop-color="#1b57d6" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#1b57d6" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bg)"/>
  <rect width="1920" height="1080" fill="url(#glow)"/>

  <!-- circuit accent dots (top-right) -->
  <g stroke="#3f7bff" stroke-opacity="0.35" stroke-width="2" fill="none">
    <path d="M1500,120 h120 v100 h140"/><path d="M1560,300 h180 v-90"/>
    <circle cx="1620" cy="120" r="5" fill="#bff365" stroke="none"/>
    <circle cx="1760" cy="220" r="5" fill="#bff365" stroke="none"/>
    <circle cx="1740" cy="210" r="4" fill="#3f7bff" stroke="none"/>
  </g>

  <!-- category chip -->
  <rect x="360" y="380" width="150" height="48" rx="24" fill="#bff365"/>
  <text x="435" y="413" text-anchor="middle" fill="#00236f" font-size="22" font-weight="800">공학계열</text>

  <!-- title -->
  <text x="360" y="530" fill="#ffffff" font-size="96" font-weight="800">CampusFlow</text>
  <rect x="364" y="556" width="330" height="8" rx="4" fill="#bff365"/>

  <!-- subtitle -->
  <text x="360" y="650" fill="#cfe0ff" font-size="46" font-weight="600">AI 기반 통합 학사 · 취업 지원 플랫폼</text>
  <text x="360" y="710" fill="#8fb0e8" font-size="28">Spring Boot · MySQL · RAG · AI 폴백 체인</text>

  <!-- footer -->
  <text x="360" y="900" fill="#a9c2ee" font-size="26">팀  나경원 · 이여울 · 등근      |      지도교수  권숙연 · 장신수</text>
  <text x="360" y="944" fill="#7f9cd0" font-size="24">전주비전대학교</text>
</svg>
